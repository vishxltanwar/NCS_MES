<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#13ec49",
                        "background-light": "#f6f8f6",
                        "background-dark": "#102215",
                    },
                    fontFamily: {
                        "display": ["Space Grotesk"]
                    },
                    borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        .glass-card {
            background: rgba(16, 34, 21, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(19, 236, 73, 0.2);
        }
        .mesh-gradient {
            background: radial-gradient(at 0% 0%, rgba(19, 236, 73, 0.15) 0%, transparent 50%),
                        radial-gradient(at 100% 100%, rgba(19, 236, 73, 0.1) 0%, transparent 50%);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 min-h-screen flex items-center justify-center overflow-hidden">
<!-- Ambient Background Elements -->
<div class="fixed inset-0 z-0 overflow-hidden pointer-events-none">
<div class="absolute top-[-10%] left-[-10%] w-[50%] h-[50%] bg-primary/10 rounded-full blur-[120px]"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[50%] h-[50%] bg-primary/5 rounded-full blur-[120px]"></div>
</div>
<div class="relative z-10 w-full max-w-md p-6 h-full flex flex-col justify-center">
<!-- Brand Header -->
<div class="flex flex-col items-center mb-10">
<div class="w-16 h-16 rounded-2xl bg-primary/20 flex items-center justify-center mb-4 border border-primary/30 shadow-[0_0_20px_rgba(19,236,73,0.2)]">
<span class="material-symbols-outlined text-primary text-4xl">factory</span>
</div>
<h1 class="text-4xl font-bold tracking-tighter text-slate-100 mb-1">MES</h1>
<p class="text-slate-400 text-sm font-medium uppercase tracking-[0.2em] leading-tight mt-1">Napino Control Systems</p>
<p class="text-[10px] text-slate-500 font-semibold uppercase tracking-widest mt-0.5">Pvt Ltd</p>
</div>
<!-- Glassmorphism Login Card -->
<div class="glass-card rounded-xl p-8 shadow-2xl relative overflow-hidden">
<div class="mesh-gradient absolute inset-0 pointer-events-none"></div>
<div class="relative z-10">
<h2 class="text-2xl font-bold text-white mb-2">Welcome back</h2>
<p class="text-slate-400 text-sm mb-8">Please enter your credentials to access the console.</p>
<form class="space-y-6">
<!-- ID Input -->
<div class="space-y-2">
<label class="text-xs font-semibold text-primary uppercase tracking-wider ml-1">Your ID</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-slate-500 text-xl group-focus-within:text-primary transition-colors">badge</span>
</div>
<input class="block w-full pl-11 pr-4 py-4 bg-slate-900/50 border border-slate-700/50 rounded-full text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary/50 transition-all" placeholder="Employee ID or Username" type="text"/>
</div>
</div>
<!-- Security Key Input -->
<div class="space-y-2">
<label class="text-xs font-semibold text-primary uppercase tracking-wider ml-1">Security Key</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-slate-500 text-xl group-focus-within:text-primary transition-colors">lock</span>
</div>
<input class="block w-full pl-11 pr-12 py-4 bg-slate-900/50 border border-slate-700/50 rounded-full text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary/50 transition-all" placeholder="••••••••" type="password"/>
<button class="absolute inset-y-0 right-0 pr-4 flex items-center" type="button">
<span class="material-symbols-outlined text-slate-500 hover:text-white transition-colors">visibility</span>
</button>
</div>
</div>
<!-- Authentication Toggle -->
<div class="flex items-center justify-between px-1">
<span class="text-sm text-slate-300 font-medium">Keep me authenticated</span>
<label class="relative inline-flex items-center cursor-pointer">
<input checked="" class="sr-only peer" type="checkbox" value=""/>
<div class="w-11 h-6 bg-slate-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary"></div>
</label>
</div>
<!-- Sign In Button -->
<button class="w-full py-4 bg-primary text-background-dark font-bold rounded-full shadow-[0_0_25px_rgba(19,236,73,0.4)] hover:shadow-[0_0_35px_rgba(19,236,73,0.6)] active:scale-[0.98] transition-all flex items-center justify-center gap-2" type="submit">
<span>SIGN IN</span>
<span class="material-symbols-outlined font-bold">arrow_forward</span>
</button>
</form>
<!-- Help Link -->
<div class="mt-8 text-center">
<a class="text-sm text-slate-400 hover:text-primary transition-colors" href="#">Forgot your credentials? Contact Support</a>
</div>
</div>
</div>
<!-- Footer Logo/Text -->
<div class="mt-auto py-8 flex flex-col items-center">
<div class="flex items-center gap-2 opacity-40">
<span class="material-symbols-outlined text-xs">verified_user</span>
<span class="text-[10px] uppercase tracking-widest font-bold">Secure Industrial Node</span>
</div>
<div class="mt-4 flex gap-4 grayscale opacity-50">
<div class="h-6 w-24 bg-primary/20 rounded flex items-center justify-center">
<span class="text-[10px] font-black italic">NCS SYSTEMS</span>
</div>
</div>
</div>
</div>
<!-- Antigravity Floating Elements (Visual Polish) -->
<div class="fixed inset-0 pointer-events-none overflow-hidden">
<div class="absolute top-[20%] right-[15%] w-2 h-2 rounded-full bg-primary/40 blur-sm"></div>
<div class="absolute bottom-[25%] left-[10%] w-3 h-3 rounded-full bg-primary/20 blur-sm"></div>
<div class="absolute top-[60%] right-[5%] w-1 h-1 rounded-full bg-primary/60"></div>
</div>
</body></html>
