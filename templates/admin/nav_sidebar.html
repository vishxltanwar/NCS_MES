{% load i18n %}

<div class="flex flex-col flex-1 py-5 overflow-y-auto" id="nav-sidebar">
  <p class="px-6 mb-3 text-[11px] font-bold uppercase tracking-[0.08em] text-[#888]">Navigation</p>
  <div class="space-y-0.5">
    <a class="nav-link admin-index-link {% if '/admin/' == request.path and not app_list %}active-nav{% endif %}" href="{% url 'admin:index' %}">
      Admin Index
    </a>
  </div>

  {% for app in available_apps %}
    <p class="px-6 mt-6 mb-3 text-[11px] font-bold uppercase tracking-[0.08em] text-[#888]">{{ app.name }}</p>
    <div class="space-y-0.5">
      {% for model in app.models %}
        <a class="nav-link model-{{ model.object_name|lower }} {% if model.admin_url in request.path %}active-nav{% endif %}" href="{{ model.admin_url }}">
          {{ model.name }}
        </a>
      {% endfor %}
    </div>
  {% endfor %}
</div>
