services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - path: deploy/.env.production
        format: raw
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    restart: unless-stopped
    env_file:
      # Raw mode preserves literal special characters in generated secrets.
      - path: deploy/.env.production
        format: raw
    environment:
      DB_HOST: db
      DB_PORT: 5432
      TRUST_X_FORWARDED_PROTO: "True"
    command: >
      sh -c "python manage.py migrate --noinput &&
      python manage.py collectstatic --noinput &&
      gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3
      --access-logfile - --error-logfile - --timeout 60"
    volumes:
      - static_data:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python manage.py check --deploy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file:
      - path: deploy/.env.production
        format: raw
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - static_data:/srv/static:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy

volumes:
  postgres_data:
  static_data:
  caddy_data:
  caddy_config:
