{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | NAPINO CONTROL SYSTEMS</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap"
    rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&display=swap"
    rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
    rel="stylesheet" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            "primary": "#635BFF",
            "bg-light": "#f8fafc"
          },
          fontFamily: {
            "display": ["Space Grotesk", "sans-serif"]
          },
          borderRadius: { "DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px" },
        }
      }
    }
  </script>
  <style>
    .glass-card {
      background: rgba(43, 43, 43, 0.6);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(212, 212, 212, 0.2);
    }

    .mesh-gradient {
      background: radial-gradient(at 0% 0%, rgba(212, 212, 212, 0.15) 0%, transparent 50%),
        radial-gradient(at 100% 100%, rgba(255, 255, 255, 0.1) 0%, transparent 50%);
    }

    @keyframes fadeUp {
      0% {
        opacity: 0;
        transform: translateY(20px);
      }

      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes progress {
      0% {
        width: 0%;
        box-shadow: 0 0 0px rgba(212, 212, 212, 0);
      }

      40% {
        width: 45%;
        box-shadow: 0 0 10px rgba(212, 212, 212, 0.5);
      }

      70% {
        width: 80%;
        box-shadow: 0 0 15px rgba(212, 212, 212, 0.8);
      }

      100% {
        width: 100%;
        box-shadow: 0 0 25px rgba(212, 212, 212, 1);
      }
    }

    @keyframes logoReveal {
      0% {
        opacity: 0;
        transform: scale(0.85) translateY(40px);
        filter: blur(12px);
      }

      100% {
        opacity: 1;
        transform: scale(1) translateY(0);
        filter: blur(0);
      }
    }
  </style>
</head>

<body
  class="bg-slate-50 font-display text-slate-900 min-h-screen flex items-center justify-center overflow-hidden transition-colors duration-[1500ms]"
  id="body-bg">

  <!-- Ambient Background Elements -->
  <div class="fixed inset-0 z-0 overflow-hidden pointer-events-none transition-opacity duration-1000" id="ambient-bg">
    <div class="absolute top-[-10%] left-[-10%] w-[50%] h-[50%] bg-primary/10 rounded-full blur-[120px]"></div>
    <div class="absolute bottom-[-10%] right-[-10%] w-[50%] h-[50%] bg-primary/5 rounded-full blur-[120px]"></div>
  </div>

  <!-- SPLASH SCREEN -->
  <div id="splash-screen"
    class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-transparent transition-all duration-[1200ms] ease-[cubic-bezier(0.22,1,0.36,1)]">
    <div
      class="relative w-80 max-w-[80vw] mb-8 flex items-center justify-center animate-[logoReveal_1.5s_cubic-bezier(0.22,1,0.36,1)_forwards]">
      <div class="absolute inset-0 bg-primary/20 rounded-[3rem] blur-[60px] animate-[pulse_3s_ease-in-out_infinite]">
      </div>
      <img src="{% static 'images/ncs_logo.png' %}?v=2" alt="Napino Control Systems Logo"
        class="relative z-10 w-full h-auto drop-shadow-md hover:scale-105 transition-transform duration-700">
    </div>

    <div class="flex items-center gap-3 mt-4 opacity-0 animate-[fadeUp_1s_ease-out_1.2s_forwards]">
      <div class="flex gap-1">
        <div class="w-1.5 h-1.5 bg-primary rounded-full animate-[bounce_1s_infinite_0ms]"></div>
        <div class="w-1.5 h-1.5 bg-primary rounded-full animate-[bounce_1s_infinite_200ms]"></div>
        <div class="w-1.5 h-1.5 bg-primary rounded-full animate-[bounce_1s_infinite_400ms]"></div>
      </div>
      <p class="text-slate-800 font-bold font-mono text-xs uppercase tracking-[0.2em]">
        Loading...
      </p>
    </div>

    <div
      class="mt-12 w-72 h-1 bg-slate-200 rounded-full overflow-hidden relative backdrop-blur-sm border border-slate-300">
      <div
        class="absolute top-0 left-0 h-full bg-gradient-to-r from-primary/40 via-primary to-primary w-0 animate-[progress_3s_cubic-bezier(0.65,0,0.35,1)_forwards] shadow-[0_0_15px_rgba(99,91,255,0.4)]">
      </div>
    </div>
  </div>

  <!-- MAIN CONTENT -->
  <div id="main-content"
    class="relative z-10 w-full max-w-[420px] p-6 h-full flex flex-col justify-center opacity-0 scale-[0.97] translate-y-6 transition-all duration-[1200ms] ease-[cubic-bezier(0.16,1,0.3,1)]">

    <!-- Brand Header -->
    <div class="flex flex-col items-center mb-6 mt-4">
      <div class="w-full flex justify-center mb-3">
        <img src="{% static 'images/ncs_logo.png' %}?v=2" alt="NCS Logo" class="w-40 object-contain drop-shadow-sm">
      </div>
      <p class="text-slate-700 text-xs font-bold uppercase tracking-[0.2em]">Manufacturing Execution System</p>
    </div>

    <!-- Login Card -->
    <div
      class="bg-white rounded-2xl p-8 shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-slate-200 relative overflow-hidden">
      <div class="absolute inset-0 bg-gradient-to-br from-slate-50 to-white pointer-events-none"></div>

      <div class="relative z-10 flex flex-col gap-6">
        <div>
          <h2 class="text-2xl font-black text-slate-900 mb-1">Sign in</h2>
          <p class="text-slate-600 font-medium text-sm">Enter your operator credentials</p>
        </div>

        <div id="error-box" class="hidden items-center gap-2 p-3 bg-red-50 border border-red-200 rounded-xl">
          <span class="material-symbols-outlined text-red-500 text-lg">error</span>
          <p id="error-text" class="text-sm text-red-700 font-bold">Invalid credentials</p>
        </div>

        <!-- ID Input -->
        <div class="space-y-2">
          <label class="text-xs font-black text-slate-700 uppercase tracking-wider ml-1">Username</label>
          <div class="relative group">
            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
              <span
                class="material-symbols-outlined text-slate-500 text-xl group-focus-within:text-primary transition-colors">person</span>
            </div>
            <input id="username" autocomplete="username"
              class="block w-full pl-11 pr-4 py-3.5 bg-slate-50 focus:bg-white border border-slate-200 rounded-xl text-slate-900 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all text-sm font-bold"
              placeholder="username" type="text" />
          </div>
        </div>

        <!-- Password Input -->
        <div class="space-y-2">
          <label class="text-xs font-black text-slate-700 uppercase tracking-wider ml-1">Password</label>
          <div class="relative group">
            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
              <span
                class="material-symbols-outlined text-slate-500 text-xl group-focus-within:text-primary transition-colors">lock</span>
            </div>
            <input id="password" autocomplete="current-password"
              class="block w-full pl-11 pr-12 py-3.5 bg-slate-50 focus:bg-white border border-slate-200 rounded-xl text-slate-900 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all text-sm font-bold"
              placeholder="••••••••" type="password" />
            <button onclick="togglePass()" class="absolute inset-y-0 right-0 pr-4 flex items-center" type="button">
              <span id="eye-icon"
                class="material-symbols-outlined text-slate-500 hover:text-primary transition-colors">visibility</span>
            </button>
          </div>
        </div>

        <!-- Sign In Button -->
        <button id="login-btn" onclick="handleLogin()"
          class="w-full mt-2 py-3.5 bg-primary text-white font-bold rounded-xl shadow-[0_4px_14px_0_rgba(99,91,255,0.39)] hover:shadow-[0_6px_20px_rgba(99,91,255,0.23)] hover:-translate-y-0.5 active:scale-[0.98] transition-all flex items-center justify-center gap-2 text-sm">
          <span>Sign in to Terminal</span>
          <span class="material-symbols-outlined font-bold text-lg">arrow_forward</span>
        </button>
      </div>
    </div>

    <!-- Footer -->
    <div class="mt-8 flex items-center justify-between px-2">
      <div class="flex items-center gap-2">
        <div class="w-2.5 h-2.5 rounded-full bg-green-500 shadow-[0_0_8px_rgba(34,197,94,0.4)] animate-pulse"></div>
        <span class="text-xs font-black text-slate-600 uppercase tracking-wider">System Online</span>
      </div>
      <div class="flex gap-4">
        <span class="text-xs font-bold tracking-widest text-slate-500">v4.12.0</span>
      </div>
    </div>
  </div>

  <!-- Floating Elements -->
  <div class="fixed inset-0 pointer-events-none overflow-hidden z-0 transition-opacity duration-1000" id="floating-bg">
    <div class="absolute top-[20%] right-[15%] w-3 h-3 rounded-full bg-primary/20 blur-[2px]"></div>
    <div class="absolute bottom-[25%] left-[10%] w-4 h-4 rounded-full bg-indigo-500/10 blur-[2px]"></div>
    <div class="absolute top-[60%] right-[5%] w-2 h-2 rounded-full bg-primary/30"></div>
  </div>

  <script>
    function togglePass() {
      const inp = document.getElementById('password');
      const icon = document.getElementById('eye-icon');
      inp.type = inp.type === 'password' ? 'text' : 'password';
      icon.textContent = inp.type === 'password' ? 'visibility' : 'visibility_off';
    }

    async function handleLogin() {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const btn = document.getElementById('login-btn');
      const errBox = document.getElementById('error-box');
      const errText = document.getElementById('error-text');

      if (!username || !password) {
        errBox.classList.remove('hidden'); errBox.classList.add('flex');
        errText.textContent = 'Please enter username and password.';
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<span class="material-symbols-outlined animate-spin text-lg">progress_activity</span><span>Signing in...</span>';

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        if (res.ok) {
          window.location.replace('/dashboard');
        } else {
          const data = await res.json();
          errBox.classList.remove('hidden'); errBox.classList.add('flex');
          errText.textContent = data.detail || 'Invalid credentials.';
          btn.disabled = false;
          btn.innerHTML = '<span>Sign in to Terminal</span><span class="material-symbols-outlined text-lg">arrow_forward</span>';
        }
      } catch (e) {
        errBox.classList.remove('hidden'); errBox.classList.add('flex');
        errText.textContent = 'Server unreachable. Is the server running?';
        btn.disabled = false;
        btn.innerHTML = '<span>Sign in to Terminal</span><span class="material-symbols-outlined text-lg">arrow_forward</span>';
      }
    }

    document.addEventListener('keydown', e => { if (e.key === 'Enter') handleLogin(); });

    // Splash screen logic
    window.addEventListener('load', () => {
      setTimeout(() => {
        const splash = document.getElementById('splash-screen');
        const content = document.getElementById('main-content');
        const ambientBg = document.getElementById('ambient-bg');

        splash.style.opacity = '0';
        splash.style.transform = 'scale(1.1) translateY(-30px)';
        splash.style.filter = 'blur(10px)';
        splash.style.pointerEvents = 'none';

        setTimeout(() => splash.remove(), 1200);

        setTimeout(() => {
          content.classList.remove('opacity-0', 'scale-[0.97]', 'translate-y-6');
        }, 600);

      }, 3400);
    });
  </script>
</body>

</html>
